# DreamerV3 size12m continued from the latest full checkpoint
# of the Stage 1 250k run to 500k total environment steps. The full checkpoints
# are near 250k because upstream saves them on wall time. The Stage 2 launcher
# copies the checkpoint and replay into the new run directory without modifying
# Stage 1.
exp: haozhe_stage2
method: dreamerv3_size12m_r128_crafter_500k

env:
  target: place_table
  reward_mode: crafter
  length: 10000

ckpt_every_steps: 10000
eval:
  n_episodes: 50
  n_envs: 8
  rng_seed: 1234
  splits: [train, heldout]

dreamer_flags:
  configs: [crafter, size12m]
  batch_size: 16
  batch_length: 64
  # Absolute target. The restored logger counter starts near 250k.
  run.steps: 500000
  run.train_ratio: 128
  run.envs: 4
  run.eval_envs: 2
  run.eval_eps: 20
  run.report_every: 900
  run.save_every: 600
  run.log_every: 120
  replay.size: 100000
  jax.platform: cuda
  jax.compute_dtype: float32
  jax.prealloc: false
  logger.outputs: [jsonl]
