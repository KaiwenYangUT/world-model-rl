# Timing only (task: re-time on an idle M2 Max, CONTRIBUTING.md rule 5). Same settings as
# configs/ppo_cnn_250k.yaml, but 50k steps, exp 'timing', checkpoints every 10k for per-10k wall-clock.
# Run with --no-eval: success numbers come from the full runs, not from this one.
#   .venv-sb3/bin/python scripts/train_sb3.py --config configs/timing_ppo_cnn_50k.yaml --seed 0 --no-eval
exp: timing
method: ppo_cnn
algo: PPO
policy: CnnPolicy
total_steps: 50000
n_envs: 8
vec_env: subproc
device: mps               # T05: mps + subproc is fastest for PPO CnnPolicy
warm_cache: true          # fill the world cache in every env before training (timed separately)

env:
  target: place_table
  reward_mode: crafter
  length: 10000

algo_kwargs:
  n_steps: 128
  n_epochs: 4
  batch_size: 256
  learning_rate: 2.5e-4
  clip_range: 0.1
  vf_coef: 0.5
  ent_coef: 0.01

eval:
  every: 10000            # checkpoint interval in env steps (also step 0)
  n_episodes: 50          # per split; PLAN.md says 20, raised because CIs at n=20 are very wide
  n_envs: 8               # parallel episodes per evaluate() call
  rng_seed: 1234          # fixed: same worlds and action-sampling seed for every checkpoint
  policy: sample
  device: cpu             # small-batch inference is faster on cpu (T05 rollout times)
  workers: 8              # checkpoints evaluated in parallel processes
  splits: [train, heldout]
