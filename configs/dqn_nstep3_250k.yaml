# Stage 3 (T14), DQN try 2: dqn_250k.yaml did not learn (2% place_table at 250k, seed 0).
# Changes: 3-step returns, exploration over 20% of training, final eps 0.05, and the plain replay
# buffer (n-step buffers do not support optimize_memory_usage). Everything else equal.
#   .venv-sb3/bin/python scripts/train_sb3.py --config configs/dqn_nstep3_250k.yaml --seed 0
exp: main
method: dqn_nstep3
algo: DQN
policy: CnnPolicy
total_steps: 250000
n_envs: 1
vec_env: dummy
device: mps               # chosen by the T14 timing check (see PLAN.md progress log)
warm_cache: true

env:
  target: place_table
  reward_mode: crafter
  length: 10000

# rl-baselines3-zoo hyperparams/dqn.yml `atari` block (checked 2026-11-04), scaled to 250k steps:
# learning_starts 1e5 -> 1e4 (zoo uses 1% of 1e7; 1e4 is 4% here), and the memory-saving buffer
# (PLAN.md §4: a 100k buffer of 64x64x3 obs is ~1.2 GB with optimize_memory_usage). No frame stack.
algo_kwargs:
  buffer_size: 100000
  learning_rate: 1.0e-4
  batch_size: 32
  learning_starts: 10000
  target_update_interval: 1000
  train_freq: 4
  gradient_steps: 1
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  n_steps: 3
  optimize_memory_usage: false  # NStepReplayBuffer does not support it (SB3 2.9); ~2.4 GB

eval:
  every: 10000
  n_episodes: 50
  n_envs: 8
  rng_seed: 1234
  policy: epsilon         # greedy with epsilon = 0.05 (PLAN.md §3)
  epsilon: 0.05
  device: cpu
  workers: 8
  splits: [train, heldout]
