# Full learning run with the standard Crafter reward. Seeds 0, 1, and 2 ran independently.
# Existing team train_dreamer.py / eval_dreamer.py; no algorithm changes.
exp: haozhe_stage1
method: dreamerv3_size12m_r128_crafter_250k
env:
  target: place_table
  reward_mode: crafter
  length: 10000
ckpt_every_steps: 10000
eval:
  n_episodes: 50
  n_envs: 8
  rng_seed: 1234
  splits: [train, heldout]
dreamer_flags:
  configs: [crafter, size12m]
  batch_size: 16
  batch_length: 64
  run.steps: 250000
  run.train_ratio: 128
  run.envs: 4
  run.eval_envs: 2
  run.eval_eps: 20
  run.report_every: 900
  run.save_every: 600
  run.log_every: 120
  replay.size: 100000
  jax.platform: cuda
  jax.compute_dtype: float32
  jax.prealloc: false
  logger.outputs: [jsonl]
