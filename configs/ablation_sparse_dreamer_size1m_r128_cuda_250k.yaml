# Fresh three-seed extension of the CUDA 200k sparse-reward configuration.
exp: ablation_sparse_cuda_250k
method: dreamerv3_r128

env:
  target: place_table
  reward_mode: sparse
  length: 10000

ckpt_every_steps: 10000

eval:
  n_episodes: 50
  n_envs: 8
  rng_seed: 1234
  splits: [train, heldout]

dreamer_flags:
  configs: [crafter, size1m]
  run.steps: 250000
  run.train_ratio: 128
  run.envs: 4
  run.eval_envs: 2
  run.eval_eps: 20
  run.report_every: -1  # Score all saved checkpoints after training.
  run.save_every: 600
  run.log_every: 60
  replay.size: 100000
  jax.platform: cuda
  jax.compute_dtype: bfloat16
  jax.prealloc: false
  logger.outputs: [jsonl]
