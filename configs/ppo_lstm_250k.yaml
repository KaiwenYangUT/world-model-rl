# Stage 3 (T13): sb3-contrib RecurrentPPO CnnLstmPolicy on CrafterTask, standard reward.
#   .venv-sb3/bin/python scripts/train_sb3.py --config configs/ppo_lstm_250k.yaml --seed 0
exp: main
method: ppo_lstm
algo: RecurrentPPO
policy: CnnLstmPolicy
total_steps: 250000
n_envs: 8
vec_env: subproc
device: mps               # chosen by the T13 timing check (see PLAN.md progress log)
warm_cache: true

env:
  target: place_table
  reward_mode: crafter
  length: 10000

# rl-baselines3-zoo hyperparams/ppo_lstm.yml `atari` block (checked 2026-11-04): same PPO
# settings as ppo_cnn, critic without LSTM, hidden size 128; constant lr / clip; no frame stack.
algo_kwargs:
  n_steps: 128
  n_epochs: 4
  batch_size: 256
  learning_rate: 2.5e-4
  clip_range: 0.1
  vf_coef: 0.5
  ent_coef: 0.01
  policy_kwargs:
    enable_critic_lstm: false
    lstm_hidden_size: 128

eval:
  every: 10000
  n_episodes: 50
  n_envs: 8
  rng_seed: 1234
  policy: sample
  device: cpu
  workers: 8
  splits: [train, heldout]
